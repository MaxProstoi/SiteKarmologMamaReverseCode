[build]
  publish = "site"
  command = "sh scripts/inject-umami.sh site"

  # Публичный website ID Umami Cloud (виден в HTML, секретом не является)
  [build.environment]
    UMAMI_WEBSITE_ID = "edbdc3a0-cf2a-42d5-bf16-2cb6aa0bbfcf"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
